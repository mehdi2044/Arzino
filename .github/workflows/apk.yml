name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "app.js", "app.css", "manifest.webmanifest", "sw.js", "icons/**", "vendor/**", "android/**", ".github/workflows/apk.yml"]

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Bundle web app into APK assets
        run: |
          W=android/app/src/main/assets/www
          mkdir -p $W
          cp -r index.html app.js app.css manifest.webmanifest sw.js icons vendor $W/
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon -q
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk arzino.apk
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          sleep 3
          gh release create apk arzino.apk --title "ارزینو برای اندروید (نسخه ${{ github.run_number }})" \
            --notes "فایل arzino.apk را دانلود و نصب کنید. اگر اندروید اجازه نداد، «نصب از منابع ناشناس» را برای مرورگر فعال کنید." --latest
